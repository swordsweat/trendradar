# Registered TrendRadar workflows
name: Check In

# ✅ 签到续期：每 6 天自动签到一次，重置 7 天计时，保持 "Get Hot News" 正常运行
# ✅ Renewal: Auto check-in every 6 days to reset the 7-day timer and keep "Get Hot News" active
#
# 📌 定时规则 / Schedule:
#   - "17 3 */6 * *" → UTC 03:17（北京时间 11:17），每月 1/7/13/19/25/31 号运行
#   - 保留手动触发 / Manual trigger still available
#
# ⚠️ 说明 / Note:
#   cron 的 */6 按月内日期计算（1,7,13,19,25,31），跨月会重置，
#   最大间隔不超过 7 天，满足签到续期要求。
#   GitHub Actions 定时任务可能因平台负载延迟数分钟。

on:
  schedule:
    - cron: "17 3 */6 * *"
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"
